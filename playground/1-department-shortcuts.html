<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arctic Fresh — Department Shortcuts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-dark-green: #00602d;
      --color-light-green: #5adb97;
      --color-coral: #ff8b69;
      --color-cream: #f5f7f3;
      --color-chip-bg: #eaf2ec;
      --color-text: #232323;
      --color-muted: #6b6b6b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Poppins', system-ui, sans-serif;
      color: var(--color-text);
      background: #fff;
      line-height: 1.5;
    }

    .demo-label {
      max-width: 1200px;
      margin: 24px auto 0;
      padding: 0 24px;
      font-size: 12px;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .section-departments {
      padding: 40px 0 48px;
      background: var(--color-cream);
      margin-top: 16px;
    }

    .section-departments__inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .section-departments__heading {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-dark-green);
      margin: 0 0 20px;
    }

    .departments {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding-inline-start: 24px;
      padding: 4px 0 12px;
      margin: 0 -24px;
      padding-inline: 24px;
      list-style: none;
      -webkit-overflow-scrolling: touch;
    }

    .departments::-webkit-scrollbar { height: 4px; }
    .departments::-webkit-scrollbar-track { background: transparent; }
    .departments::-webkit-scrollbar-thumb {
      background: rgba(0, 96, 45, 0.2);
      border-radius: 2px;
    }

    .department {
      flex: 0 0 auto;
      scroll-snap-align: start;
    }

    .department__link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      width: 88px;
      padding: 4px;
      border-radius: 8px;
      transition: transform 0.15s ease;
    }

    .department__link:hover { transform: translateY(-2px); }

    .department__link:focus-visible {
      outline: 2px solid var(--color-dark-green);
      outline-offset: 4px;
    }

    .department__icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      background: var(--color-chip-bg);
      border-radius: 50%;
      font-size: 32px;
      transition: background 0.15s ease;
    }

    .department__link:hover .department__icon {
      background: var(--color-light-green);
    }

    .department__label {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-dark-green);
      text-align: center;
      line-height: 1.25;
    }

    @media (min-width: 960px) {
      .departments {
        gap: 16px;
        overflow-x: visible;
        justify-content: space-between;
        margin: 0;
        padding-inline: 0;
      }
    }
  </style>
</head>
<body>
  <p class="demo-label">Demo 1 · Department shortcuts</p>

  <section class="section-departments" aria-labelledby="departments-heading">
    <div class="section-departments__inner">
      <h2 id="departments-heading" class="section-departments__heading">Shop by department</h2>

      <ul class="departments" role="list">
        <li class="department">
          <a class="department__link" href="#">
            <span class="department__icon" aria-hidden="true">🥩</span>
            <span class="department__label">Meat &amp; Seafood</span>
          </a>
        </li>
        <li class="department">
          <a class="department__link" href="#">
            <span class="department__icon" aria-hidden="true">🥬</span>
            <span class="department__label">Produce</span>
          </a>
        </li>
        <li class="department">
          <a class="department__link" href="#">
            <span class="department__icon" aria-hidden="true">🥛</span>
            <span class="department__label">Dairy &amp; Eggs</span>
          </a>
        </li>
        <li class="department">
          <a class="department__link" href="#">
            <span class="department__icon" aria-hidden="true">🥫</span>
            <span class="department__label">Pantry</span>
          </a>
        </li>
        <li class="department">
          <a class="department__link" href="#">
            <span class="department__icon" aria-hidden="true">🧊</span>
            <span class="department__label">Frozen</span>
          </a>
        </li>
        <li class="department">
          <a class="department__link" href="#">
            <span class="department__icon" aria-hidden="true">🧃</span>
            <span class="department__label">Drinks</span>
          </a>
        </li>
        <li class="department">
          <a class="department__link" href="#">
            <span class="department__icon" aria-hidden="true">🍼</span>
            <span class="department__label">Baby &amp; Kids</span>
          </a>
        </li>
        <li class="department">
          <a class="department__link" href="#">
            <span class="department__icon" aria-hidden="true">🧽</span>
            <span class="department__label">Household</span>
          </a>
        </li>
        <li class="department">
          <a class="department__link" href="#">
            <span class="department__icon" aria-hidden="true">💊</span>
            <span class="department__label">Health &amp; Beauty</span>
          </a>
        </li>
      </ul>
    </div>
  </section>
</body>
</html>
